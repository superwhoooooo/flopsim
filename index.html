<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flopsim</title>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="wheel"></div>
  <div id="journal"></div>
  <div id="pause" class="overlay show">
    <div class="pause-box">
      <h1>FLOPSIM</h1>
      <p id="pauseMsg">Loading physics...</p>
      <div class="controls">
        <div><b>WASD</b> move</div><div><b>Shift</b> sprint</div><div><b>Space</b> jump</div><div><b>LMB</b> attack</div>
        <div><b>Hold Tab</b> weapon wheel</div><div><b>1 - 0</b> say a line</div><div><b>E</b> talk / quests</div><div><b>J</b> journal</div>
        <div><b>K</b> third person</div><div><b>L</b> first person</div><div><b>Esc</b> pause</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
